<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Royal Blue Gradient -->
    <linearGradient id="devhub-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e70e9" />
      <stop offset="100%" stop-color="#0e4fb8" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#devhub-brand-grad)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Central Telemetry Spine (Connected Operational Hub) -->
  <line x1="256" y1="184" x2="256" y2="328" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="184" r="15" fill="#60a5fa" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="328" r="15" fill="#60a5fa" stroke="#ffffff" stroke-width="4" />

  <!-- Horizontal Telemetry Ping Indicators -->
  <circle cx="204" cy="256" r="6" fill="#bfdbfe" />
  <circle cx="308" cy="256" r="6" fill="#bfdbfe" />

  <!-- Center Active Hub Core (Telemetry Signal) -->
  <circle cx="256" cy="256" r="34" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />

  <!-- Left Developer Bracket '{' -->
  <path
    d="M 196 144 C 152 144, 136 172, 136 210 L 136 234 C 136 248, 118 256, 102 256 C 118 256, 136 264, 136 278 L 136 302 C 136 340, 152 368, 196 368"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Developer Bracket '}' -->
  <path
    d="M 316 144 C 360 144, 376 172, 376 210 L 376 234 C 376 248, 394 256, 410 256 C 394 256, 376 264, 376 278 L 376 302 C 376 340, 360 368, 316 368"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
